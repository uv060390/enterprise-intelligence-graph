services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/eigraphdev
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      # small on purpose: the synthetic graph is tiny and dev VMs (colima) are RAM-poor
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - neo4j-data:/data

  # The eight mock source systems, one process. Extracts generate at startup, so the
  # first boot takes a few seconds longer than later ones.
  mocks:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    command: ["uvicorn", "mocks.app:app", "--host", "0.0.0.0", "--port", "8010"]
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://localhost:8010/health')"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

volumes:
  neo4j-data:

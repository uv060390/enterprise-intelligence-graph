[project]
name = "enterprise-intelligence-graph"
version = "0.1.0"
description = "Neo4j agentic knowledge graph: agent-adjudicated entity resolution, GDS provider anomaly detection, conversational graph analyst — on synthetic data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Utkarsh Vaibhav" }]
dependencies = [
    "pydantic>=2.7",
    "neo4j>=5.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27", # fastapi.testclient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "mocks", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: integration tests needing a running Neo4j (skipped when bolt port closed)",
]
